name: update
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Update version and hash
        run: |
          latest=$(curl -fsSL https://cdn.arctracker.io/link/linux/latest.json)
          version=$(jq -r .version <<<"$latest")
          hash=$(nix hash convert --hash-algo sha256 --to sri "$(jq -r .sha256 <<<"$latest")")
          sed -i -e "s|version = \".*\";|version = \"$version\";|" \
                 -e "s|hash = \".*\";|hash = \"$hash\";|" flake.nix
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Build and commit
        run: |
          git diff --quiet && exit 0
          NIXPKGS_ALLOW_UNFREE=1 nix build --impure .#
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "flake: updated ARC Tracker Link to $version."
          git push
